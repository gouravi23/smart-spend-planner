kind = "web"
previewPath = "/"
title = "SmartSpend"
version = "1.0.0"
id = "artifacts/smartspend"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25429

[services.development]
run = "pnpm --filter @workspace/smartspend run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smartspend", "run", "build" ]
publicDir = "artifacts/smartspend/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25429"
BASE_PATH = "/"
